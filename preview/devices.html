<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astons — Device Preview (Desktop · Tablet · Mobile)</title>

  <!--
    DEVICE PREVIEW
    Path:    /preview/devices.html
    Purpose: Side-by-side device frames pointing at /preview/index.html.
    Frames are real iframes at fixed widths and scaled with CSS transform
    so they all fit in the viewport. Each frame has its own scroll.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #EEF1F5;
      --panel: #ffffff;
      --ink: #0E1628;
      --muted: #6B7280;
      --border: #D7DCE3;

      --desktop-w: 1440px;
      --desktop-h: 900px;
      --tablet-w:  834px;
      --tablet-h:  1100px;
      --mobile-w:  390px;
      --mobile-h:  844px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .topbar p  { margin: 0; font-size: 12px; color: var(--muted); }
    .topbar a  { font-size: 12px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    .stage {
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 28px;
      align-items: start;
      justify-content: center;
      min-height: calc(100vh - 50px);
    }

    .device {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .device .meta {
      font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
    }
    .device .meta strong { color: var(--ink); margin-right: 6px; font-weight: 700; }

    .frame {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 30px 60px -30px rgba(14,22,40,0.25), 0 8px 20px -10px rgba(14,22,40,0.10);
      overflow: hidden;
      position: relative;
    }
    .frame iframe {
      border: 0; display: block; background: #fff;
    }

    /* Desktop frame */
    .frame.desktop {
      width: calc(var(--desktop-w) * var(--scale-d));
      height: calc(var(--desktop-h) * var(--scale-d));
    }
    .frame.desktop iframe {
      width: var(--desktop-w); height: var(--desktop-h);
      transform: scale(var(--scale-d));
      transform-origin: 0 0;
    }

    /* Tablet frame */
    .frame.tablet {
      width: calc(var(--tablet-w) * var(--scale-t));
      height: calc(var(--tablet-h) * var(--scale-t));
      border-radius: 22px;
      padding: 14px;
      background: #0E1628;
    }
    .frame.tablet .screen {
      width: 100%; height: 100%; border-radius: 10px; overflow: hidden; background: #fff;
    }
    .frame.tablet iframe {
      width: var(--tablet-w); height: var(--tablet-h);
      transform: scale(var(--scale-t));
      transform-origin: 0 0;
    }

    /* Mobile frame — phone bezel look */
    .frame.mobile {
      width: calc(var(--mobile-w) * var(--scale-m));
      height: calc(var(--mobile-h) * var(--scale-m));
      border-radius: 38px;
      padding: 10px;
      background: #0E1628;
    }
    .frame.mobile .notch {
      position: absolute;
      top: 14px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 22px; background: #0E1628; border-radius: 12px;
      z-index: 2;
    }
    .frame.mobile .screen {
      width: 100%; height: 100%; border-radius: 28px; overflow: hidden; background: #fff;
    }
    .frame.mobile iframe {
      width: var(--mobile-w); height: var(--mobile-h);
      transform: scale(var(--scale-m));
      transform-origin: 0 0;
    }

    /* Scales — chosen so the three frames fit a 1440-wide stage comfortably.
       The desktop frame compresses the most; tablet and phone stay close to 1:1. */
    .stage {
      --scale-d: 0.46;
      --scale-t: 0.62;
      --scale-m: 0.78;
    }
    @media (max-width: 1500px) {
      .stage { --scale-d: 0.40; --scale-t: 0.55; --scale-m: 0.72; }
    }
    @media (max-width: 1280px) {
      .stage {
        --scale-d: 0.36; --scale-t: 0.50; --scale-m: 0.64;
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }
    @media (max-width: 720px) {
      .stage { --scale-d: 0.22; --scale-t: 0.32; --scale-m: 0.46; padding: 14px; gap: 18px; }
    }

    .dim {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Astons Law Chambers — device preview</h1>
      <p>Desktop 1440 · Tablet 834 · Mobile 390 — all pointing at /preview/index.html</p>
    </div>
    <a href="./index.html" target="_blank" rel="noopener">Open full-bleed preview ↗</a>
  </div>

  <div class="stage">
    <div class="device">
      <div class="meta"><strong>Desktop</strong>1440 × 900</div>
      <div class="frame desktop">
        <iframe src="./index.html" title="Astons preview — desktop" loading="eager"></iframe>
      </div>
      <div class="dim">Scaled to fit. Scroll the frame to navigate.</div>
    </div>

    <div class="device">
      <div class="meta"><strong>Tablet</strong>834 × 1100</div>
      <div class="frame tablet">
        <div class="screen">
          <iframe src="./index.html" title="Astons preview — tablet" loading="eager"></iframe>
        </div>
      </div>
      <div class="dim">iPad-class width.</div>
    </div>

    <div class="device">
      <div class="meta"><strong>Mobile</strong>390 × 844</div>
      <div class="frame mobile">
        <div class="notch"></div>
        <div class="screen">
          <iframe src="./index.html" title="Astons preview — mobile" loading="eager"></iframe>
        </div>
      </div>
      <div class="dim">iPhone 14 / 15 class width.</div>
    </div>
  </div>
</body>
</html>
