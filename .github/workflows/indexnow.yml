name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit live sitemap URLs to IndexNow
        env:
          # IndexNow keys are public by design (served at the keyLocation URL),
          # so this is not a secret. It must match public/<key>.txt.
          INDEXNOW_KEY: 371c281e8c5d2e3882e2b0d3753fbf385c243140faec5b9a474097a0d11dee09
        run: |
          set -euo pipefail

          # Wait for the new Vercel deploy to publish, so the sitemap we read
          # already contains any pages added in this push (new sub-pages, etc.).
          sleep 90

          # Pull the live sitemap and extract every <loc>. Retry in case the
          # deploy is still propagating. The sitemap is the single source of
          # truth, so this list never drifts out of date again.
          urls=$(curl -fsS --retry 6 --retry-delay 15 --retry-all-errors \
                   https://astonslaw.com/sitemap.xml \
                 | grep -oE '<loc>[^<]+</loc>' \
                 | sed -E 's#</?loc>##g')

          if [ -z "$urls" ]; then
            echo "::error::No URLs extracted from sitemap.xml — aborting."
            exit 1
          fi

          count=$(printf '%s\n' "$urls" | wc -l | tr -d ' ')
          echo "Submitting $count URLs to IndexNow."

          payload=$(printf '%s\n' "$urls" \
            | jq -R . \
            | jq -s --arg key "$INDEXNOW_KEY" '{
                host: "astonslaw.com",
                key: $key,
                keyLocation: ("https://astonslaw.com/" + $key + ".txt"),
                urlList: .
              }')

          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")

          echo "IndexNow responded: HTTP $status"
          # IndexNow returns 200 (accepted) or 202 (accepted, validating key).
          case "$status" in
            200|202) echo "Submission accepted." ;;
            *) echo "::error::IndexNow rejected submission (HTTP $status)."; exit 1 ;;
          esac
