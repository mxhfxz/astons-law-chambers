  <div id="stickyBar" role="group" aria-label="Contact Astons Law Chambers">
    <a
      href="https://cal.com/astonslaw/callback?overlayCalendar=true"
      aria-label="Book a consultation with Astons Law Chambers"
      data-track="book_click"
      data-track-location="sticky_bar"
      class="sticky-bar-call"
    >
      <svg class="w-[18px] h-[18px] shrink-0" aria-hidden="true"><use href="#i-calendar"/></svg>
      <span class="sticky-bar-call-text">
        <span class="sticky-bar-label">Book a Consultation</span>
      </span>
    </a>
    <a
      href="https://wa.me/447922247999"
      aria-label="Message Astons Law Chambers on WhatsApp"
      data-track="whatsapp_click"
      data-track-location="sticky_bar"
      class="sticky-bar-wa"
    >
      <svg class="w-[18px] h-[18px]" aria-hidden="true"><use href="#i-whatsapp"/></svg>
      <span class="sr-only">WhatsApp</span>
    </a>
    <a
      href="tel:+447922247999"
      aria-label="Call Astons Law Chambers on 07922 247 999"
      data-track="call_click"
      data-track-location="sticky_bar"
      class="sticky-bar-book"
    >
      <svg class="w-[18px] h-[18px]" aria-hidden="true"><use href="#i-phone"/></svg>
      <span class="sr-only">Call now</span>
    </a>
  </div>
